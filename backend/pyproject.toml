[project]
name = "investimentos-backend"
version = "0.1.0"
description = "Personal investment consolidation platform - backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "yfinance>=1.4.1",
    "apscheduler>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
