# Publishes the frozen showcase to GitHub Pages.
#
# The data is not generated here: `backend/scripts/prerender_static_demo.py`
# writes frontend/public/data from the demo database (which is gitignored,
# since it also holds a quote cache), and those JSON files are committed.
# So this workflow only builds the app — and a reviewer can read exactly
# what the public page will serve.
name: Publicar vitrine

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Build (static demo, served under the repository path)
        run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_STATIC_DEMO: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
